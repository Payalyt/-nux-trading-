<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NUX • Web Trading Platform</title>
    <!-- Suppress benign browser extension fetch override errors -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        if (msg && (msg.includes('Cannot set property fetch') || msg.includes('fetch'))) {
          return true;
        }
      };
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('Cannot set property fetch') || event.message.includes('fetch'))) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message && event.reason.message.includes('fetch') || String(event.reason).includes('fetch'))) {
          event.preventDefault();
        }
      });
    </script>
    <meta name="description" content="Modern, responsive, and intuitive binary options and live web trading platform." />
    <!-- Cache Control Meta Tags to ensure immediate updates -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
